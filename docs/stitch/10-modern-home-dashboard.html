<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SignLink - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface-container": "#eceef0",
                    "tertiary-fixed-dim": "#bcc7de",
                    "secondary-fixed": "#ffdea7",
                    "background": "#f7f9fb",
                    "on-surface-variant": "#424654",
                    "surface": "#f7f9fb",
                    "primary": "#003e9b",
                    "on-primary-fixed": "#001847",
                    "surface-bright": "#f7f9fb",
                    "secondary": "#7c5800",
                    "tertiary": "#3a4458",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-background": "#191c1e",
                    "error-container": "#ffdad6",
                    "primary-container": "#0554ca",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-container": "#c9d4ec",
                    "inverse-primary": "#b2c5ff",
                    "primary-fixed": "#dae2ff",
                    "tertiary-container": "#515c70",
                    "surface-container-high": "#e6e8ea",
                    "on-surface": "#191c1e",
                    "outline": "#737785",
                    "on-tertiary-fixed-variant": "#3c475a",
                    "inverse-surface": "#2d3133",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#fdb808",
                    "outline-variant": "#c3c6d6",
                    "on-tertiary-fixed": "#111c2d",
                    "tertiary-fixed": "#d8e3fb",
                    "secondary-fixed-dim": "#ffbb1a",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#5e4200",
                    "surface-tint": "#0e57cd",
                    "on-secondary-fixed": "#271900",
                    "inverse-on-surface": "#eff1f3",
                    "surface-container-highest": "#e0e3e5",
                    "on-secondary-container": "#6a4b00",
                    "surface-variant": "#e0e3e5",
                    "on-primary-fixed-variant": "#0040a0",
                    "surface-dim": "#d8dadc",
                    "primary-fixed-dim": "#b2c5ff",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#c6d4ff",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "margin-desktop": "40px",
                    "unit": "4px",
                    "stack-sm": "8px",
                    "stack-lg": "32px",
                    "gutter": "24px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "label-md": [
                            "JetBrains Mono"
                    ],
                    "headline-lg-mobile": [
                            "Manrope"
                    ],
                    "headline-lg": [
                            "Manrope"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Manrope"
                    ],
                    "body-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "label-md": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-lg": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ]
            }
          }
        }
      }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen relative flex flex-col items-center">
<div class="w-full max-w-md mx-auto relative min-h-screen bg-background pb-32">
<!-- TopAppBar (From JSON) -->
<header class="bg-surface dark:bg-surface-dim flat no shadows flex items-center justify-between px-margin-mobile w-full h-16 docked full-width top-0 sticky z-40">
<div class="flex items-center text-primary dark:text-primary-fixed cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low transition-colors p-2 rounded-full -ml-2">
<span class="material-symbols-outlined text-[24px]">gesture</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">SignLink</h1>
<!-- Placeholder for right icon if needed to balance flex-between, or profile avatar -->
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<main class="w-full">
<!-- Welcome Banner -->
<section class="px-margin-mobile mt-4">
<div class="bg-secondary-container rounded-2xl p-6 relative overflow-hidden shadow-sm">
<!-- Decorative subtle circle -->
<div class="absolute -right-10 -top-10 w-32 h-32 bg-secondary rounded-full opacity-10"></div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-container relative z-10 mb-1">
                        Hello, Alex!
                    </h2>
<p class="font-body-lg text-body-lg text-on-secondary-container opacity-90 relative z-10">
                        Ready to learn?
                    </p>
</div>
</section>
<!-- Primary Actions (Bento Style) -->
<section class="px-margin-mobile mt-stack-md grid grid-cols-2 gap-4">
<button class="bg-primary-container text-on-primary-container rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm active:scale-95 transition-transform hover:opacity-90">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">translate</span>
<span class="font-headline-md text-[18px] leading-[24px] font-semibold text-center">Translate<br/>Sign</span>
</button>
<button class="bg-primary-container text-on-primary-container rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm active:scale-95 transition-transform hover:opacity-90">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">sign_language</span>
<span class="font-headline-md text-[18px] leading-[24px] font-semibold text-center">Text to<br/>Sign</span>
</button>
</section>
<!-- Daily Lesson Progress Card -->
<section class="px-margin-mobile mt-stack-lg">
<div class="flex items-center justify-between mb-stack-sm">
<h3 class="font-headline-md text-[20px] leading-[28px] text-on-surface">Daily Lesson</h3>
<button class="font-label-md text-label-md text-primary hover:underline">View All</button>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-sm flex items-center justify-between cursor-pointer active:scale-[0.98] transition-transform hover:bg-surface-container-lowest/80">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary mb-1 uppercase tracking-wider">In Progress</span>
<h4 class="font-headline-md text-[18px] leading-[24px] text-on-surface mb-1">Basics: Greetings</h4>
<p class="font-body-md text-body-md text-on-surface-variant">Lesson 3 of 10</p>
</div>
<!-- Circular Progress Indicator -->
<div class="relative w-16 h-16 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<!-- Background Circle -->
<path class="text-surface-variant" d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4"></path>
<!-- Progress Circle (30%) -->
<path class="text-primary" d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="30, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-label-md text-label-md text-primary font-bold">30%</span>
</div>
</div>
</div>
</section>
<!-- Quick Access Grid -->
<section class="px-margin-mobile mt-stack-lg mb-8">
<h3 class="font-headline-md text-[20px] leading-[28px] text-on-surface mb-stack-sm">Quick Access</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Card 1 -->
<div class="bg-surface-container border border-outline-variant/50 rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform hover:bg-surface-container-high">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-2 rounded-lg flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">abc</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Alphabet Practice</span>
</div>
<!-- Card 2 -->
<div class="bg-surface-container border border-outline-variant/50 rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform hover:bg-surface-container-high">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-2 rounded-lg flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">menu_book</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Dictionary</span>
</div>
<!-- Card 3 -->
<div class="bg-surface-container border border-outline-variant/50 rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform hover:bg-surface-container-high">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-2 rounded-lg flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">quiz</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Quizzes</span>
</div>
<!-- Card 4 -->
<div class="bg-surface-container border border-outline-variant/50 rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform hover:bg-surface-container-high">
<div class="bg-tertiary-fixed text-on-tertiary-fixed p-2 rounded-lg flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">group</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Community</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (From JSON) -->
<nav class="fixed bottom-0 w-full max-w-md z-50 flex justify-around items-center h-20 px-4 pb-safe bg-surface-container-lowest dark:bg-inverse-surface shadow-md docked full-width bottom-0 rounded-t-xl">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-1 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<!-- Live (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-6 py-1 hover:bg-surface-container-high transition-all active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-[24px]">videocam</span>
<span class="font-label-md text-label-md mt-1">Live</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-6 py-1 hover:bg-surface-container-high transition-all active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-label-md text-label-md mt-1">Settings</span>
</button>
</nav>
</div>
</body></html>
